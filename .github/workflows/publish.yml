name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=src/connic --cov-report=term-missing

  check-and-release:
    # Only run this job if triggered by a push to main
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.check_tag.outputs.should_publish }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Extract version from pyproject.toml
        id: extract
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          pattern = (
              r"v?(?:[0-9]+!)?[0-9]+(?:\.[0-9]+)*"
              r"(?:[-_.]?(?:alpha|a|beta|b|preview|pre|c|rc)[-_.]?[0-9]*)?"
              r"(?:-[0-9]+|[-_.]?(?:post|rev|r)[-_.]?[0-9]*)?"
              r"(?:[-_.]?dev[-_.]?[0-9]*)?(?:\+[a-z0-9]+(?:[-_.][a-z0-9]+)*)?"
          )
          if not isinstance(version, str) or not re.fullmatch(pattern, version, re.IGNORECASE | re.ASCII):
              raise SystemExit("Invalid project version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version=v{version}\n")
          PY

      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $VERSION does not exist. Creating release..."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.extract.outputs.version }}
          name: Release ${{ steps.extract.outputs.version }}
          generate_release_notes: true

  build:
    # Run if it's a manual release OR if the check-and-release job created a new release
    needs: [test, check-and-release]
    if: |
      always() && !failure() && !cancelled() &&
      (github.event_name == 'release' || needs.check-and-release.outputs.should_publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build, check-and-release]
    if: |
      always() && !failure() && !cancelled() &&
      (github.event_name == 'release' || needs.check-and-release.outputs.should_publish == 'true')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/connic-composer-sdk
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
